services:
  sewing-studio:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:3000:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3

  sewing-studio-dev:
    profiles: ["dev"]
    image: node:24.14.0-alpine
    working_dir: /app
    command: >-
      sh -c "corepack enable && corepack prepare pnpm@10.12.4 --activate &&
      pnpm install --frozen-lockfile &&
      WATCHPACK_POLLING=true pnpm exec next dev --webpack --hostname 0.0.0.0 --port 3000"
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - sewing-studio-node-modules:/app/node_modules

volumes:
  sewing-studio-node-modules:
